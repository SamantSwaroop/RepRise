name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build packages
        run: |
          pnpm --filter @reprise/shared build
          pnpm --filter @reprise/api build
      - name: Verify Docker build
        run: docker build -f apps/api/Dockerfile -t reprise-api:ci .

