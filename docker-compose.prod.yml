# ==============================================================================
# RepRise — Production Docker Compose Orchestration
# Run: docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: reprise-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reprise_prod_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-reprise}
    volumes:
      - reprise_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reprise} -d ${POSTGRES_DB:-reprise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - reprise-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: reprise-api-prod
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-reprise}:${POSTGRES_PASSWORD:-reprise_prod_password_change_me}@postgres:5432/${POSTGRES_DB:-reprise}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-set_a_long_random_jwt_access_secret_in_env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-set_a_long_random_jwt_refresh_secret_in_env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reprise-network

volumes:
  reprise_postgres_prod_data:
    name: reprise_postgres_prod_data

networks:
  reprise-network:
    name: reprise-network
    driver: bridge
