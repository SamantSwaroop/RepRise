services:
  - type: web
    name: reprise-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: web
    name: reprise-web
    runtime: static
    buildCommand: pnpm build:web
    staticPublishPath: ./apps/mobile/dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://reprise-api-l3yn.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
